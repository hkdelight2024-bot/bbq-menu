<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>BBQ Menu</title>

  <link rel="stylesheet" href="menu.css">

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    body {
      background: #f7f0df;
      font-family:
        Arial,
        "Microsoft JhengHei",
        "Noto Sans CJK TC",
        sans-serif;
    }

    /* Designed for the Hisense 32A4QAU at 1366 × 768 */
    #menu {
      width: 1366px;
      height: 768px;
      box-sizing: border-box;
      background: #f7f0df;
    }

    .title {
      height: 105px;

      background: #990000;
      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 52px;
      font-weight: bold;
    }

    .content {
      padding: 20px 55px;
    }

    .row {
      display: grid;

      grid-template-columns:
        300px
        1fr
        280px;

      align-items: center;

      min-height: 72px;

      border-bottom: 1px solid #aaa;

      font-size: 32px;
    }

    .chinese {
      font-size: 36px;
      font-weight: bold;
    }

    .english {
      font-size: 32px;
      font-weight: bold;
    }

    .price {
      font-size: 39px;
      font-weight: bold;
      color: #a00000;
      text-align: right;
    }

    /*
      BLACK SCREEN MODE
    */

    body.closed {
      background: #000 !important;
    }

    body.closed #menu {
      display: none !important;
    }
  </style>
</head>


<body>

<div id="menu">

  <div class="title">
    港式燒味 &nbsp; | &nbsp; BBQ ROAST MEATS

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
>

<title>HK Delight Promotions</title>

<link
  rel="stylesheet"
  href="shared.css"
>

<style>

* {
  box-sizing:
    border-box;
}


html,
body {
  width: 100%;
  height: 100%;

  margin: 0;
  padding: 0;

  overflow: hidden;

  background: #000;
}


/* ========================================
   FULL SCREEN
   ======================================== */

#viewport {
  position: fixed;

  inset: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: #000;
}


/* ========================================
   IMAGE LAYERS

   Two layers allow smooth crossfading.
   ======================================== */

.promo-image {
  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;

  object-fit:
    contain;

  object-position:
    center;

  background: #000;

  opacity: 0;

  transition:
    opacity 0.8s ease;
}


.promo-image.active {
  opacity: 1;
}


/* ========================================
   FALLBACK
   ======================================== */

#fallback {
  position: absolute;

  inset: 0;

  display: none;

  align-items: center;
  justify-content: center;

  color: #ddd;

  background: #000;

  font-family:
    Arial,
    sans-serif;

  font-size: 30px;

  text-align: center;

  padding: 50px;
}

</style>

</head>


<body>


<div id="viewport">


<img
  id="promoA"
  class="promo-image active"
  alt=""
>


<img
  id="promoB"
  class="promo-image"
  alt=""
>


<div id="fallback">
  Promotions unavailable
</div>


</div>


<script>

/* ========================================
   STATE
   ======================================== */

let promoImages = [];

let currentIndex = 0;

let slideTimer = null;

let rosterTimer = null;

let currentConfig = null;


let frontImage =
  document.getElementById(
    "promoA"
  );


let backImage =
  document.getElementById(
    "promoB"
  );


/* ========================================
   TEST IMAGE

   Missing placeholder files simply fail
   this test and are excluded.
   ======================================== */

function imageExists(
  url
) {

  return new Promise(
    function(resolve) {

      const image =
        new Image();


      image.onload =
        function() {

          resolve(true);

        };


      image.onerror =
        function() {

          resolve(false);

        };


      image.src =
        url +
        "?t=" +
        Date.now();

    }
  );

}


/* ========================================
   BUILD VALID ROSTER
   ======================================== */

async function buildValidImageList(
  list
) {

  const valid = [];


  for (
    let i = 0;
    i < list.length;
    i++
  ) {

    const exists =
      await imageExists(
        list[i]
      );


    if (exists) {

      valid.push(
        list[i]
      );

    }

  }


  return valid;

}


/* ========================================
   PRELOAD
   ======================================== */

function preloadImages() {

  promoImages.forEach(
    function(url) {

      const preload =
        new Image();


      preload.src =
        url;

    }
  );

}


/* ========================================
   FIRST IMAGE
   ======================================== */

function showFirstImage() {

  const fallback =
    document.getElementById(
      "fallback"
    );


  if (
    promoImages.length === 0
  ) {

    fallback.style.display =
      "flex";


    frontImage.style.display =
      "none";


    backImage.style.display =
      "none";


    return;

  }


  fallback.style.display =
    "none";


  frontImage.style.display =
    "block";


  backImage.style.display =
    "block";


  currentIndex =
    0;


  frontImage.src =
    promoImages[0];


  frontImage
    .classList
    .add(
      "active"
    );


  backImage
    .classList
    .remove(
      "active"
    );

}


/* ========================================
   NEXT IMAGE
   ======================================== */

function nextPromotion() {

  if (
    promoImages.length <= 1
  ) {

    return;

  }


  currentIndex =
    (
      currentIndex + 1
    )
    %
    promoImages.length;


  const nextUrl =
    promoImages[
      currentIndex
    ];


  backImage.onload =
    function() {


      backImage
        .classList
        .add(
          "active"
        );


      frontImage
        .classList
        .remove(
          "active"
        );


      const oldFront =
        frontImage;


      frontImage =
        backImage;


      backImage =
        oldFront;

    };


  backImage.src =
    nextUrl;

}


/* ========================================
   SLIDE TIMER
   ======================================== */

function restartSlideTimer() {

  if (slideTimer) {

    clearInterval(
      slideTimer
    );

  }


  if (
    promoImages.length > 1
  ) {

    slideTimer =
      setInterval(

        nextPromotion,

        currentConfig
          .slideDurationMs
        ||
        30000

      );

  }

}


/* ========================================
   APPLY ROSTER
   ======================================== */

async function applyRoster(
  config
) {

  if (
    !config ||
    !Array.isArray(
      config.images
    )
  ) {

    return;

  }


  const valid =
    await buildValidImageList(
      config.images
    );


  const oldList =
    JSON.stringify(
      promoImages
    );


  const newList =
    JSON.stringify(
      valid
    );


  currentConfig =
    config;


  /*
    Nothing changed.
  */

  if (
    oldList ===
    newList
  ) {

    return;

  }


  promoImages =
    valid;


  preloadImages();


  showFirstImage();


  restartSlideTimer();

}


/* ========================================
   LOAD promo-list.js

   Cache-busted so GitHub changes are
   discovered automatically.
   ======================================== */

function loadPromoRoster() {

  const oldScript =
    document.getElementById(
      "promoRosterScript"
    );


  if (oldScript) {

    oldScript.remove();

  }


  const script =
    document.createElement(
      "script"
    );


  script.id =
    "promoRosterScript";


  script.src =
    "promo-list.js?t=" +
    Date.now();


  script.onload =
    function() {


      if (
        typeof PROMO_CONFIG ===
        "undefined"
      ) {

        return;

      }


      applyRoster(
        PROMO_CONFIG
      );


      /*
        Start periodic roster check once.
      */

      if (
        !rosterTimer
      ) {

        rosterTimer =
          setInterval(

            loadPromoRoster,

            PROMO_CONFIG
              .rosterRefreshMs
            ||
            300000

          );

      }

    };


  script.onerror =
    function() {

      /*
        If offline, keep the currently
        running roster untouched.
      */

      console.log(
        "Promo roster unavailable. Keeping current rotation."
      );

    };


  document.body.appendChild(
    script
  );

}


/* ========================================
   START PROMOS
   ======================================== */

loadPromoRoster();

</script>


<!-- SHARED SCREENSAVER + OFFLINE ENGINE -->

<script src="shared.js"></script>


</body>

</html>

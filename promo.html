<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
>

<title>HK Delight Promotions</title>

<link
  rel="stylesheet"
  href="shared.css"
>

<style>

* {
  box-sizing:
    border-box;
}

html,
body {

  width: 100%;
  height: 100%;

  margin: 0;
  padding: 0;

  overflow: hidden;

  background: #000;

}

#viewport {

  position: fixed;

  inset: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: #000;

}

.promo-image {

  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: contain;

  object-position: center;

  background: #000;

  opacity: 0;

  transition:
    opacity 0.8s ease;

}

.promo-image.active {

  opacity: 1;

}

#fallback {

  position: absolute;

  inset: 0;

  display: none;

  align-items: center;
  justify-content: center;

  color: #ddd;

  font-family:
    Arial,
    sans-serif;

  font-size: 30px;

  background: #000;

}

</style>

</head>


<body>


<div id="viewport">

<img
  id="promoA"
  class="promo-image active"
  alt=""
>

<img
  id="promoB"
  class="promo-image"
  alt=""
>

<div id="fallback">
Promotions unavailable
</div>

</div>


<script>

let promoImages = [];

let currentIndex = 0;

let frontImage =
  document.getElementById(
    "promoA"
  );

let backImage =
  document.getElementById(
    "promoB"
  );

let slideTimer = null;

let rosterTimer = null;

let currentConfig = null;



function imageExists(url) {

  return new Promise(
    function(resolve) {

      const image =
        new Image();


      image.onload =
        function() {

          resolve(true);

        };


      image.onerror =
        function() {

          resolve(false);

        };


      image.src =
        url +
        "?t=" +
        Date.now();

    }
  );

}



async function buildValidImageList(
  imageList
) {

  const valid = [];


  for (
    let i = 0;
    i < imageList.length;
    i++
  ) {

    const exists =
      await imageExists(
        imageList[i]
      );


    if (exists) {

      valid.push(
        imageList[i]
      );

    }

  }


  return valid;

}



function preloadImages() {

  promoImages.forEach(
    function(url) {

      const image =
        new Image();

      image.src =
        url;

    }
  );

}



function showFirstImage() {

  const fallback =
    document.getElementById(
      "fallback"
    );


  if (
    promoImages.length === 0
  ) {

    fallback.style.display =
      "flex";

    return;

  }


  fallback.style.display =
    "none";


  currentIndex = 0;


  frontImage.src =
    promoImages[0];


  frontImage.classList.add(
    "active"
  );


  backImage.classList.remove(
    "active"
  );

}



function nextPromotion() {

  if (
    promoImages.length <= 1
  ) {

    return;

  }


  currentIndex =
    (
      currentIndex + 1
    )
    %
    promoImages.length;


  const nextUrl =
    promoImages[
      currentIndex
    ];


  backImage.onload =
    function() {


      backImage.classList.add(
        "active"
      );


      frontImage.classList.remove(
        "active"
      );


      const oldFront =
        frontImage;


      frontImage =
        backImage;


      backImage =
        oldFront;

    };


  backImage.src =
    nextUrl;

}



function restartSlideTimer() {

  if (slideTimer) {

    clearInterval(
      slideTimer
    );

  }


  if (
    promoImages.length > 1
  ) {

    slideTimer =
      setInterval(

        nextPromotion,

        currentConfig
          .slideDurationMs

      );

  }

}



async function applyRoster(
  config
) {

  if (
    !config ||
    !Array.isArray(
      config.images
    )
  ) {

    return;

  }


  const valid =
    await buildValidImageList(
      config.images
    );


  const changed =
    JSON.stringify(valid)
    !==
    JSON.stringify(promoImages);


  currentConfig =
    config;


  if (!changed) {

    return;

  }


  promoImages =
    valid;


  preloadImages();

  showFirstImage();

  restartSlideTimer();

}



function loadPromoRoster() {

  const previous =
    document.getElementById(
      "promoRosterScript"
    );


  if (previous) {

    previous.remove();

  }


  const script =
    document.createElement(
      "script"
    );


  script.id =
    "promoRosterScript";


  script.src =
    "promo-list.js?t=" +
    Date.now();


  script.onload =
    function() {


      if (
        typeof PROMO_CONFIG ===
        "undefined"
      ) {

        return;

      }


      applyRoster(
        PROMO_CONFIG
      );


      if (!rosterTimer) {

        rosterTimer =
          setInterval(

            loadPromoRoster,

            PROMO_CONFIG
              .rosterRefreshMs
            ||
            300000

          );

      }

    };


  document.body.appendChild(
    script
  );

}


loadPromoRoster();



/* SHARED SCREENSAVER */

const sharedScript =
  document.createElement(
    "script"
  );


sharedScript.src =
  "shared.js?t=" +
  Date.now();


document.body.appendChild(
  sharedScript
);



/* OFFLINE SERVICE WORKER */

if (
  "serviceWorker" in navigator
) {

  window.addEventListener(
    "load",
    function() {

      navigator
        .serviceWorker
        .register(
          "service-worker.js"
        )
        .catch(
          function(error) {

            console.log(
              "Service worker failed:",
              error
            );

          }
        );

    }
  );

}

</script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
>

<title>HK Delight Promotions</title>

<link
  rel="stylesheet"
  href="shared.css?v=4"
>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;

  margin: 0;
  padding: 0;

  overflow: hidden;

  background: #000;
}

#viewport {
  position: fixed;

  inset: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: #000;
}


/* ========================================
   PROMO IMAGE LAYERS
   ======================================== */

.promo-image {
  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: contain;

  object-position: center;

  background: #000;

  opacity: 0;

  transition: opacity 0.8s ease;
}

.promo-image.active {
  opacity: 1;
}


/* ========================================
   FALLBACK
   ======================================== */

#fallback {
  position: absolute;

  inset: 0;

  display: none;

  align-items: center;
  justify-content: center;

  padding: 50px;

  color: #ddd;

  background: #000;

  text-align: center;

  font-family:
    Arial,
    sans-serif;

  font-size: 30px;
}

</style>

</head>


<body>


<div id="viewport">


<img
  id="promoA"
  class="promo-image active"
  alt=""
>


<img
  id="promoB"
  class="promo-image"
  alt=""
>


<div id="fallback">
  Promotions unavailable
</div>


</div>


<script>

/* ========================================
   STATE
   ======================================== */

var promoImages = [];

var currentIndex = 0;

var slideTimer = null;

var rosterTimer = null;

var currentConfig = null;


var frontImage =
  document.getElementById(
    "promoA"
  );


var backImage =
  document.getElementById(
    "promoB"
  );


/* ========================================
   CHECK WHETHER IMAGE EXISTS
   ======================================== */

function imageExists(
  url
) {

  return new Promise(
    function(resolve) {

      var image =
        new Image();


      image.onload =
        function() {

          resolve(true);

        };


      image.onerror =
        function() {

          resolve(false);

        };


      image.src =
        url +
        "?t=" +
        Date.now();

    }
  );

}


/* ========================================
   BUILD VALID IMAGE LIST
   ======================================== */

function buildValidImageList(
  list
) {

  var jobs = [];


  for (
    var i = 0;
    i < list.length;
    i++
  ) {

    (
      function(url) {

        jobs.push(

          imageExists(
            url
          )

          .then(
            function(exists) {

              return {
                url: url,
                exists: exists
              };

            }
          )

        );

      }
    )(
      list[i]
    );

  }


  return Promise.all(
    jobs
  )

  .then(
    function(results) {

      var valid = [];


      for (
        var i = 0;
        i < results.length;
        i++
      ) {

        if (
          results[i].exists
        ) {

          valid.push(
            results[i].url
          );

        }

      }


      return valid;

    }
  );

}


/* ========================================
   PRELOAD
   ======================================== */

function preloadImages() {

  for (
    var i = 0;
    i < promoImages.length;
    i++
  ) {

    var preload =
      new Image();


    preload.src =
      promoImages[i];

  }

}


/* ========================================
   SHOW FIRST IMAGE
   ======================================== */

function showFirstImage() {

  var fallback =
    document.getElementById(
      "fallback"
    );


  if (
    promoImages.length === 0
  ) {

    fallback.style.display =
      "flex";


    frontImage.style.display =
      "none";


    backImage.style.display =
      "none";


    return;

  }


  fallback.style.display =
    "none";


  frontImage.style.display =
    "block";


  backImage.style.display =
    "block";


  currentIndex =
    0;


  frontImage.onload =
    function() {

      frontImage
        .classList
        .add(
          "active"
        );

    };


  frontImage.src =
    promoImages[0];


  backImage
    .classList
    .remove(
      "active"
    );

}


/* ========================================
   NEXT PROMOTION
   ======================================== */

function nextPromotion() {

  if (
    promoImages.length <= 1
  ) {

    return;

  }


  currentIndex =
    (
      currentIndex + 1
    )
    %
    promoImages.length;


  var nextUrl =
    promoImages[
      currentIndex
    ];


  backImage.onload =
    function() {


      backImage
        .classList
        .add(
          "active"
        );


      frontImage
        .classList
        .remove(
          "active"
        );


      var oldFront =
        frontImage;


      frontImage =
        backImage;


      backImage =
        oldFront;

    };


  backImage.src =
    nextUrl;

}


/* ========================================
   SLIDE TIMER
   ======================================== */

function restartSlideTimer() {

  if (
    slideTimer
  ) {

    clearInterval(
      slideTimer
    );

  }


  if (
    promoImages.length > 1
  ) {

    slideTimer =
      setInterval(

        nextPromotion,

        currentConfig &&
        currentConfig.slideDurationMs
          ?
          currentConfig.slideDurationMs
          :
          30000

      );

  }

}


/* ========================================
   APPLY PROMO ROSTER
   ======================================== */

function applyRoster(
  config
) {

  if (
    !config ||
    !config.images ||
    !Array.isArray(
      config.images
    )
  ) {

    return;

  }


  buildValidImageList(
    config.images
  )

  .then(
    function(valid) {

      var oldList =
        JSON.stringify(
          promoImages
        );


      var newList =
        JSON.stringify(
          valid
        );


      currentConfig =
        config;


      if (
        oldList ===
        newList
      ) {

        /*
          The image list hasn't changed, but the
          slide interval may have changed remotely.
        */

        restartSlideTimer();

        return;

      }


      promoImages =
        valid;


      preloadImages();

      showFirstImage();

      restartSlideTimer();

    }
  );

}


/* ========================================
   LOAD / RELOAD promo-list.js
   ======================================== */

function loadPromoRoster() {

  var previous =
    document.getElementById(
      "promoRosterScript"
    );


  if (
    previous &&
    previous.parentNode
  ) {

    previous.parentNode.removeChild(
      previous
    );

  }


  var script =
    document.createElement(
      "script"
    );


  script.id =
    "promoRosterScript";


  script.src =
    "promo-list.js?t=" +
    Date.now();


  script.onload =
    function() {


      if (
        typeof PROMO_CONFIG ===
        "undefined"
      ) {

        return;

      }


      applyRoster(
        PROMO_CONFIG
      );


      /*
        Establish the roster polling timer once.
      */

      if (
        !rosterTimer
      ) {

        rosterTimer =
          setInterval(

            loadPromoRoster,

            PROMO_CONFIG.rosterRefreshMs ||
            300000

          );

      }

    };


  script.onerror =
    function() {

      /*
        If internet disappears, leave the existing
        slideshow running with its current images.
      */

      console.log(
        "Promo roster unavailable; keeping current rotation."
      );

    };


  document.body.appendChild(
    script
  );

}


/* ========================================
   START
   ======================================== */

loadPromoRoster();

</script>


<script src="shared.js?v=4"></script>


</body>
</html>

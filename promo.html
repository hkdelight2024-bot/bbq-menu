<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>HK Delight Promotions</title>
<link rel="stylesheet" href="shared.css?v=4">
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000}
#viewport{position:fixed;inset:0;background:#000;overflow:hidden}
.promo-media{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;background:#000;opacity:0;transition:opacity .8s ease}
.promo-media.active{opacity:1}
#fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:50px;color:#ddd;text-align:center;font:30px Arial,sans-serif}
</style>
</head>
<body>
<div id="viewport">
<img id="imageA" class="promo-media" alt="">
<img id="imageB" class="promo-media" alt="">
<video id="videoA" class="promo-media" muted playsinline preload="none"></video>
<video id="videoB" class="promo-media" muted playsinline preload="none"></video>
<div id="fallback">Promotions unavailable</div>
</div>
<script>
/* Roster checks are cheap; image URLs are stable and cached by the service worker. */
var promoItems=[],currentIndex=0,slideTimer=null,rosterTimer=null,currentConfig=null;
var activeElement=null,nextSlot='A',rosterLoading=false,rosterSequence=0,showSequence=0;
var imageA=document.getElementById('imageA'),imageB=document.getElementById('imageB');
var videoA=document.getElementById('videoA'),videoB=document.getElementById('videoB');
var fallback=document.getElementById('fallback');
var knownGood={};
function extension(url){return url.split(/[?#]/)[0].split('.').pop().toLowerCase();}
function isVideo(url){var e=extension(url);return e==='mp4'||e==='webm';}
function normalize(url){return new URL(url,location.href).href;}
function deactivate(el){if(!el)return;el.classList.remove('active');if(el.tagName==='VIDEO'){try{el.pause();}catch(e){}}}
function hideAll(){[imageA,imageB,videoA,videoB].forEach(deactivate);activeElement=null;}
function checkImage(url){return new Promise(function(resolve){
 var img=new Image(),done=false;var timeout=setTimeout(function(){finish(false);},12000);
 function finish(ok){if(done)return;done=true;clearTimeout(timeout);img.onload=null;img.onerror=null;resolve(ok);}
 img.onload=function(){finish(true);};img.onerror=function(){finish(false);};img.src=url;
});}
/* Video metadata checks may transfer data, so check only new video URLs. */
function checkVideo(url){return new Promise(function(resolve){
 var v=document.createElement('video'),done=false;v.preload='metadata';v.muted=true;
 var timeout=setTimeout(function(){finish(false);},12000);
 function finish(ok){if(done)return;done=true;clearTimeout(timeout);v.onloadedmetadata=null;v.onerror=null;v.removeAttribute('src');try{v.load();}catch(e){}resolve(ok);}
 v.onloadedmetadata=function(){finish(true);};v.onerror=function(){finish(false);};v.src=url;
});}
function validateRoster(items){
 var unique=[],seen={};items.forEach(function(raw){if(typeof raw!=='string'||!raw.trim())return;
 try{var u=normalize(raw.trim());if(new URL(u).origin!==location.origin)return;if(!seen[u]){seen[u]=true;unique.push(u);}}catch(e){}
 });
 /* Check new or previously unavailable files only. No repeat full-roster downloads. */
 return Promise.all(unique.map(function(url){
  if(knownGood[url])return Promise.resolve(url);
  return (isVideo(url)?checkVideo(url):checkImage(url)).then(function(ok){if(ok){knownGood[url]=true;return url;}return null;});
 })).then(function(results){return results.filter(function(x){return !!x;});});
}
function showMedia(url){return new Promise(function(resolve){
 var video=isVideo(url),el;
 if(nextSlot==='A'){el=video?videoA:imageA;nextSlot='B';}else{el=video?videoB:imageB;nextSlot='A';}
 var prior=activeElement,done=false,timeout=setTimeout(function(){finish(false);},15000);
 function finish(ok){if(done)return;done=true;clearTimeout(timeout);el.onload=null;el.onerror=null;el.oncanplay=null;
  if(ok){el.classList.add('active');if(prior&&prior!==el)deactivate(prior);activeElement=el;fallback.style.display='none';if(video){try{var p=el.play();if(p&&p.catch)p.catch(function(){});}catch(e){}}}
  resolve(ok);
 }
 el.onerror=function(){finish(false);};
 if(video){el.muted=true;el.loop=true;el.setAttribute('playsinline','');el.oncanplay=function(){finish(true);};el.src=url;try{el.load();}catch(e){finish(false);}}
 else{el.onload=function(){finish(true);};el.src=url;if(el.complete&&el.naturalWidth>0)finish(true);}
});}
function showCurrentItem(){
 var seq=++showSequence;
 if(!promoItems.length){hideAll();fallback.style.display='flex';return;}
 if(currentIndex>=promoItems.length)currentIndex=0;
 var attempts=0;
 function attempt(){if(seq!==showSequence)return;
  if(attempts>=promoItems.length){hideAll();fallback.style.display='flex';return;}
  var url=promoItems[currentIndex];showMedia(url).then(function(ok){if(seq!==showSequence)return;if(ok)return;
   /* A runtime failure should be retried on a future roster check. */
   delete knownGood[url];attempts++;currentIndex=(currentIndex+1)%promoItems.length;attempt();
  });
 }
 attempt();
}
function nextPromotion(){if(promoItems.length<2)return;currentIndex=(currentIndex+1)%promoItems.length;showCurrentItem();}
function restartSlideTimer(){if(slideTimer)clearInterval(slideTimer);slideTimer=null;
 if(promoItems.length>1){var duration=Number(currentConfig&&currentConfig.slideDurationMs)||30000;
 slideTimer=setInterval(nextPromotion,Math.max(3000,duration));}}
function applyRoster(config){if(!config||!Array.isArray(config.images))return;
 var seq=++rosterSequence;
 validateRoster(config.images).then(function(valid){if(seq!==rosterSequence)return;
  var changed=JSON.stringify(valid)!==JSON.stringify(promoItems);
  var previousUrl=promoItems[currentIndex];currentConfig=config;
  if(changed){promoItems=valid;var idx=valid.indexOf(previousUrl);currentIndex=idx>=0?idx:0;
   if(!activeElement||idx<0)showCurrentItem();}
  restartSlideTimer();
 }).catch(function(e){console.log('Roster validation failed',e);});
}
function loadPromoRoster(){if(rosterLoading)return;rosterLoading=true;
 var old=document.getElementById('promoRosterScript');if(old&&old.parentNode)old.parentNode.removeChild(old);
 var script=document.createElement('script');script.id='promoRosterScript';
 script.src='promo-list.js?t='+Date.now();
 script.onload=function(){rosterLoading=false;if(typeof PROMO_CONFIG!=='undefined'){
  applyRoster(PROMO_CONFIG);
  var interval=Math.max(60000,Number(PROMO_CONFIG.rosterRefreshMs)||300000);
  if(rosterTimer)clearInterval(rosterTimer);rosterTimer=setInterval(loadPromoRoster,interval);
 }};
 script.onerror=function(){rosterLoading=false;console.log('Roster unavailable; keeping current rotation.');
  if(!rosterTimer)rosterTimer=setInterval(loadPromoRoster,300000);
 };
 document.body.appendChild(script);
}
loadPromoRoster();
</script>
<script src="shared.js?v=4"></script>
</body>
</html>

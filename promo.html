<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>HK Delight Promotions</title>
<link rel="stylesheet" href="shared.css">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#promoScreen{position:fixed;inset:0;background:#000;overflow:hidden}
.promoImage{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;display:none}
.promoImage.visible{display:block}
#promoMessage{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:#fff;font:28px Arial,sans-serif;text-align:center}
body.screensaver-active #promoScreen{display:none!important}
body.screensaver-active{background:#000!important}
</style>
</head>
<body>
<div id="promoScreen">
<img id="promoA" class="promoImage" alt="">
<img id="promoB" class="promoImage" alt="">
<div id="promoMessage">Promotions unavailable</div>
</div>
<script>
(function(){
'use strict';
var a=document.getElementById('promoA'),b=document.getElementById('promoB'),message=document.getElementById('promoMessage');
var list=[],index=0,active=null,slideTimer=null,rosterTimer=null,retryTimer=null,loading=false;
var slideDuration=60000,rosterRefresh=300000,serial=0;
var bad={},ready={};
function normalise(input){
 var out=[],seen={};
 if(!input||!input.length)return out;
 for(var i=0;i<input.length;i++){
  if(typeof input[i]!=='string')continue;
  try{
   var u=new URL(input[i],location.href);
   if(u.origin!==location.origin||!/\.jpe?g$/i.test(u.pathname))continue;
   /* Image URLs are stable: changing artwork requires a new filename. */
   var key=u.href;
   if(!seen[key]){seen[key]=true;out.push(key);}
  }catch(e){}
 }
 return out;
}
function showError(){if(!active){message.style.display='flex';}}
function loadInto(url,target,callback){
 var finished=false;
 var timeout=setTimeout(function(){finish(false);},12000);
 function finish(ok){if(finished)return;finished=true;clearTimeout(timeout);target.onload=null;target.onerror=null;callback(ok);}
 target.onload=function(){finish(true);};
 target.onerror=function(){finish(false);};
 if(target.src!==url)target.src=url;
 else if(target.complete&&target.naturalWidth>0)finish(true);
}
function display(start){
 var token=++serial;
 if(!list.length){showError();return;}
 var tries=0;
 function attempt(){
  if(token!==serial)return;
  if(tries>=list.length){showError();return;}
  var url=list[index],target=active===a?b:a;
  if(active&&active.src===url&&active.complete&&active.naturalWidth>0){message.style.display='none';return;}
  if(bad[url]&&Date.now()-bad[url]<300000){tries++;index=(index+1)%list.length;attempt();return;}
  loadInto(url,target,function(ok){
   if(token!==serial)return;
   if(!ok){bad[url]=Date.now();tries++;index=(index+1)%list.length;attempt();return;}
   delete bad[url];ready[url]=true;
   target.className='promoImage visible';
   if(active&&active!==target)active.className='promoImage';
   active=target;message.style.display='none';
  });
 }
 attempt();
}
function next(){if(!list.length){showError();return;}index=(index+1)%list.length;display();}
function restartSlide(){if(slideTimer)clearInterval(slideTimer);slideTimer=setInterval(next,slideDuration);}
function restartRoster(){if(rosterTimer)clearInterval(rosterTimer);rosterTimer=setInterval(fetchRoster,rosterRefresh);}
function apply(config){
 if(!config||!config.images||!Array.isArray(config.images))return;
 var newList=normalise(config.images);
 var d=Number(config.slideDurationMs),r=Number(config.rosterRefreshMs);
 if(isFinite(d)&&d>=3000)slideDuration=d;
 if(isFinite(r)&&r>=60000)rosterRefresh=r;
 var changed=JSON.stringify(list)!==JSON.stringify(newList);
 if(changed){
  var current=list[index];list=newList;
  var found=list.indexOf(current);index=found>=0?found:0;
  if(!active||found<0)display();
 }
 restartSlide();restartRoster();
}
function fetchRoster(){
 if(loading)return;
 loading=true;
 var script=document.createElement('script'),done=false;
 script.src='promo-list.js?t='+Date.now();
 var timeout=setTimeout(function(){finish(false);},15000);
 function finish(ok){
  if(done)return;done=true;clearTimeout(timeout);loading=false;
  script.onload=null;script.onerror=null;
  if(script.parentNode)script.parentNode.removeChild(script);
  if(ok&&typeof PROMO_CONFIG!=='undefined')apply(PROMO_CONFIG);
  else showError();
 }
 script.onload=function(){finish(true);};script.onerror=function(){finish(false);};
 document.body.appendChild(script);
}
message.style.display='flex';
fetchRoster();restartSlide();restartRoster();
})();
</script>
<script src="shared.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
>

<title>HK Delight Promotions</title>

<link
  rel="stylesheet"
  href="shared.css?v=4"
>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;

  margin: 0;
  padding: 0;

  overflow: hidden;

  background: #000;
}

#viewport {
  position: fixed;
  inset: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: #000;
}


/* =========================================================
   MEDIA LAYERS
   ========================================================= */

.promo-media {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: contain;
  object-position: center;

  background: #000;

  opacity: 0;

  transition:
    opacity 0.8s ease;
}

.promo-media.active {
  opacity: 1;
}


/* =========================================================
   FALLBACK
   ========================================================= */

#fallback {
  position: absolute;
  inset: 0;

  display: none;

  align-items: center;
  justify-content: center;

  padding: 50px;

  color: #ddd;
  background: #000;

  text-align: center;

  font-family:
    Arial,
    sans-serif;

  font-size: 30px;
}

</style>

</head>


<body>


<div id="viewport">


  <!--
    Two image layers and two video layers.

    We alternate between A and B so transitions
    can occur without exposing a blank frame.
  -->


  <img
    id="imageA"
    class="promo-media"
    alt=""
  >


  <img
    id="imageB"
    class="promo-media"
    alt=""
  >


  <video
    id="videoA"
    class="promo-media"
    muted
    playsinline
    preload="auto"
  ></video>


  <video
    id="videoB"
    class="promo-media"
    muted
    playsinline
    preload="auto"
  ></video>


  <div id="fallback">
    Promotions unavailable
  </div>


</div>


<script>

/* =========================================================
   STATE
   ========================================================= */

var promoItems = [];

var currentIndex = 0;

var slideTimer = null;

var rosterTimer = null;

var currentConfig = null;

var activeElement = null;

var nextSlot = "A";


/* =========================================================
   ELEMENTS
   ========================================================= */

var imageA =
  document.getElementById(
    "imageA"
  );

var imageB =
  document.getElementById(
    "imageB"
  );

var videoA =
  document.getElementById(
    "videoA"
  );

var videoB =
  document.getElementById(
    "videoB"
  );

var fallback =
  document.getElementById(
    "fallback"
  );


/* =========================================================
   FILE TYPE
   ========================================================= */

function getExtension(
  url
) {

  var clean =
    url
      .split("?")[0]
      .split("#")[0];


  var dot =
    clean.lastIndexOf(".");


  if (
    dot === -1
  ) {

    return "";

  }


  return clean
    .substring(
      dot + 1
    )
    .toLowerCase();

}


function isVideo(
  url
) {

  var extension =
    getExtension(
      url
    );


  return (
    extension === "mp4" ||
    extension === "webm"
  );

}


/* =========================================================
   HIDE / STOP MEDIA
   ========================================================= */

function deactivateElement(
  element
) {

  if (
    !element
  ) {

    return;

  }


  element
    .classList
    .remove(
      "active"
    );


  if (
    element.tagName ===
    "VIDEO"
  ) {

    try {

      element.pause();

    }

    catch (error) {

    }

  }

}


function hideAllMedia() {

  var elements = [
    imageA,
    imageB,
    videoA,
    videoB
  ];


  for (
    var i = 0;
    i < elements.length;
    i++
  ) {

    deactivateElement(
      elements[i]
    );

  }

}


/* =========================================================
   PICK NEXT DISPLAY ELEMENT
   ========================================================= */

function getNextElement(
  url
) {

  var video =
    isVideo(
      url
    );


  var element;


  if (
    nextSlot === "A"
  ) {

    element =
      video
        ? videoA
        : imageA;


    nextSlot =
      "B";

  }

  else {

    element =
      video
        ? videoB
        : imageB;


    nextSlot =
      "A";

  }


  return element;

}


/* =========================================================
   CHECK IMAGE
   ========================================================= */

function checkImage(
  url
) {

  return new Promise(
    function(resolve) {

      var image =
        new Image();


      var finished =
        false;


      var timeout =
        setTimeout(
          function() {

            if (
              finished
            ) {

              return;

            }


            finished =
              true;


            resolve(
              false
            );

          },
          12000
        );


      image.onload =
        function() {

          if (
            finished
          ) {

            return;

          }


          finished =
            true;


          clearTimeout(
            timeout
          );


          resolve(
            true
          );

      };


      image.onerror =
        function() {

          if (
            finished
          ) {

            return;

          }


          finished =
            true;


          clearTimeout(
            timeout
          );


          resolve(
            false
          );

      };


      image.src =
        url +
        "?check=" +
        Date.now();

    }
  );

}


/* =========================================================
   CHECK VIDEO
   ========================================================= */

function checkVideo(
  url
) {

  return new Promise(
    function(resolve) {

      var video =
        document.createElement(
          "video"
        );


      var finished =
        false;


      video.muted =
        true;


      video.preload =
        "metadata";


      var timeout =
        setTimeout(
          function() {

            if (
              finished
            ) {

              return;

            }


            finished =
              true;


            try {

              video.src =
                "";

            }

            catch (error) {

            }


            resolve(
              false
            );

          },
          15000
        );


      function success() {

        if (
          finished
        ) {

          return;

        }


        finished =
          true;


        clearTimeout(
          timeout
        );


        try {

          video.src =
            "";

        }

        catch (error) {

        }


        resolve(
          true
        );

      }


      function failure() {

        if (
          finished
        ) {

          return;

        }


        finished =
          true;


        clearTimeout(
          timeout
        );


        try {

          video.src =
            "";

        }

        catch (error) {

        }


        resolve(
          false
        );

      }


      video.onloadedmetadata =
        success;


      video.oncanplay =
        success;


      video.onerror =
        failure;


      video.src =
        url +
        "?check=" +
        Date.now();


      try {

        video.load();

      }

      catch (error) {

        failure();

      }

    }
  );

}


/* =========================================================
   CHECK MEDIA
   ========================================================= */

function mediaExists(
  url
) {

  if (
    isVideo(
      url
    )
  ) {

    return checkVideo(
      url
    );

  }


  return checkImage(
    url
  );

}


/* =========================================================
   BUILD VALID ROSTER
   ========================================================= */

function buildValidMediaList(
  list
) {

  var jobs = [];


  for (
    var i = 0;
    i < list.length;
    i++
  ) {

    (
      function(url) {

        jobs.push(

          mediaExists(
            url
          )

          .then(
            function(exists) {

              return {
                url: url,
                exists: exists
              };

            }
          )

        );

      }
    )(
      list[i]
    );

  }


  return Promise.all(
    jobs
  )

  .then(
    function(results) {

      var valid = [];


      for (
        var i = 0;
        i < results.length;
        i++
      ) {

        if (
          results[i].exists
        ) {

          valid.push(
            results[i].url
          );

        }

      }


      return valid;

    }
  );

}


/* =========================================================
   PRELOAD IMAGES
   ========================================================= */

function preloadImages() {

  for (
    var i = 0;
    i < promoItems.length;
    i++
  ) {

    if (
      !isVideo(
        promoItems[i]
      )
    ) {

      var image =
        new Image();


      image.src =
        promoItems[i];

    }

  }

}


/* =========================================================
   SHOW MEDIA
   ========================================================= */

function showMedia(
  url
) {

  return new Promise(
    function(resolve) {

      var element =
        getNextElement(
          url
        );


      var previous =
        activeElement;


      if (
        isVideo(
          url
        )
      ) {

        element.muted =
          true;


        element.loop =
          true;


        element.autoplay =
          true;


        element.setAttribute(
          "playsinline",
          ""
        );


        element.oncanplay =
          function() {


            element
              .classList
              .add(
                "active"
              );


            if (
              previous &&
              previous !== element
            ) {

              deactivateElement(
                previous
              );

            }


            activeElement =
              element;


            var playResult;


            try {

              playResult =
                element.play();

            }

            catch (error) {

            }


            if (
              playResult &&
              typeof playResult.catch ===
              "function"
            ) {

              playResult.catch(
                function() {

                  /*
                    Muted autoplay normally succeeds.
                    If this particular browser refuses,
                    the media remains visible at its
                    available frame and rotation continues.
                  */

                }
              );

            }


            resolve(
              true
            );

        };


        element.onerror =
          function() {

            resolve(
              false
            );

        };


        element.src =
          url;


        try {

          element.load();

        }

        catch (error) {

          resolve(
            false
          );

        }

      }

      else {

        element.onload =
          function() {


            element
              .classList
              .add(
                "active"
              );


            if (
              previous &&
              previous !== element
            ) {

              deactivateElement(
                previous
              );

            }


            activeElement =
              element;


            resolve(
              true
            );

        };


        element.onerror =
          function() {

            resolve(
              false
            );

        };


        element.src =
          url;

      }

    }
  );

}


/* =========================================================
   SHOW CURRENT ITEM
   ========================================================= */

function showCurrentItem() {

  if (
    promoItems.length === 0
  ) {

    hideAllMedia();


    fallback.style.display =
      "flex";


    return;

  }


  fallback.style.display =
    "none";


  if (
    currentIndex >=
    promoItems.length
  ) {

    currentIndex =
      0;

  }


  var attempts =
    0;


  function attempt() {

    if (
      attempts >=
      promoItems.length
    ) {

      hideAllMedia();


      fallback.style.display =
        "flex";


      return;

    }


    var url =
      promoItems[
        currentIndex
      ];


    showMedia(
      url
    )

    .then(
      function(success) {

        if (
          success
        ) {

          return;

        }


        /*
          Runtime failure:
          skip this item and try the next one.
        */

        attempts++;


        currentIndex =
          (
            currentIndex + 1
          )
          %
          promoItems.length;


        attempt();

      }
    );

  }


  attempt();

}


/* =========================================================
   NEXT PROMOTION
   ========================================================= */

function nextPromotion() {

  if (
    promoItems.length <= 1
  ) {

    return;

  }


  currentIndex =
    (
      currentIndex + 1
    )
    %
    promoItems.length;


  showCurrentItem();

}


/* =========================================================
   SLIDE TIMER
   ========================================================= */

function restartSlideTimer() {

  if (
    slideTimer
  ) {

    clearInterval(
      slideTimer
    );

  }


  if (
    promoItems.length > 1
  ) {

    var duration =
      30000;


    if (
      currentConfig &&
      currentConfig.slideDurationMs
    ) {

      duration =
        currentConfig.slideDurationMs;

    }


    slideTimer =
      setInterval(
        nextPromotion,
        duration
      );

  }

}


/* =========================================================
   APPLY REMOTE ROSTER
   ========================================================= */

function applyRoster(
  config
) {

  if (
    !config ||
    !config.images ||
    !Array.isArray(
      config.images
    )
  ) {

    return;

  }


  buildValidMediaList(
    config.images
  )

  .then(
    function(valid) {

      var oldList =
        JSON.stringify(
          promoItems
        );


      var newList =
        JSON.stringify(
          valid
        );


      currentConfig =
        config;


      /*
        Same roster:
        keep current media but allow remotely
        changed slide duration to take effect.
      */

      if (
        oldList ===
        newList
      ) {

        restartSlideTimer();

        return;

      }


      promoItems =
        valid;


      currentIndex =
        0;


      preloadImages();


      showCurrentItem();


      restartSlideTimer();

    }
  );

}


/* =========================================================
   LOAD / RELOAD promo-list.js
   ========================================================= */

function loadPromoRoster() {

  var previous =
    document.getElementById(
      "promoRosterScript"
    );


  if (
    previous &&
    previous.parentNode
  ) {

    previous.parentNode.removeChild(
      previous
    );

  }


  var script =
    document.createElement(
      "script"
    );


  script.id =
    "promoRosterScript";


  script.src =
    "promo-list.js?t=" +
    Date.now();


  script.onload =
    function() {


      if (
        typeof PROMO_CONFIG ===
        "undefined"
      ) {

        return;

      }


      applyRoster(
        PROMO_CONFIG
      );


      /*
        Start roster polling once.

        The current configuration uses five minutes.
      */

      if (
        !rosterTimer
      ) {

        rosterTimer =
          setInterval(

            loadPromoRoster,

            PROMO_CONFIG.rosterRefreshMs ||
            300000

          );

      }

    };


  script.onerror =
    function() {

      /*
        Network failure does NOT stop the
        currently-running promotion rotation.
      */

      console.log(
        "Promo roster unavailable; keeping current rotation."
      );

    };


  document.body.appendChild(
    script
  );

}


/* =========================================================
   START
   ========================================================= */

loadPromoRoster();

</script>


<script src="shared.js?v=4"></script>


</body>
</html>
